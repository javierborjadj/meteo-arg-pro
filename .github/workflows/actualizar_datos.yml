name: Actualizar Meteo-Arg-Pro (Cada 1 Hora)

on:
  schedule:
    - cron: '10 * * * *' # Corre automáticamente cada 1 hora (minuto 10 de cada hora)
  workflow_dispatch:     # Permite ejecutarlo manualmente con 1 clic en GitHub

permissions:
  contents: write

jobs:
  actualizar-datos:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ejecutar Auditoria Horaria (Temperatura y Agua)
        run: python src/motor_meteorologico.py

      - name: Guardar historial horario en el repositorio
        run: |
          git config --global user.name 'Meteo-Arg-Pro Bot'
          git config --global user.email 'bot@meteo-arg-pro.local'
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update horario: Auditoria Temp y Agua AMBA" && git push)
